<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product CRUD Management</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <header>
        <h1>Product Management</h1>
        <p>Node.js CRUD Application</p>
    </header>

    <section class="form-card">

        <h2 id="formTitle">Add New Product</h2>

        <form id="productForm">

            <input type="hidden" id="productId">

            <div class="form-group">
                <label>Product Name</label>
                <input
                    type="text"
                    id="productName"
                    placeholder="Enter product name"
                    required
                >
            </div>

            <div class="form-group">
                <label>Price (₹)</label>
                <input
                    type="number"
                    id="productPrice"
                    placeholder="Enter price"
                    min="0"
                    step="0.01"
                    required
                >
            </div>

            <div class="form-group">
                <label>Quantity</label>
                <input
                    type="number"
                    id="productQuantity"
                    placeholder="Enter quantity"
                    min="0"
                    required
                >
            </div>

            <div class="buttons">
                <button type="submit" id="saveBtn">Add Product</button>
                <button type="button" id="cancelBtn" class="cancel">
                    Cancel
                </button>
            </div>

        </form>

    </section>

    <section class="table-card">

        <div class="table-header">
            <h2>Product List</h2>

            <input
                type="text"
                id="searchInput"
                placeholder="Search products..."
            >
        </div>

        <div class="table-responsive">

            <table>

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Product Name</th>
                        <th>Price</th>
                        <th>Quantity</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="productTable">
                </tbody>

            </table>

        </div>

        <p id="message"></p>

    </section>

</div>

<script src="script.js"></script>

</body>
</html>
